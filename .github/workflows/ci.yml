name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  integration:
    name: Database migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ward_ops
          POSTGRES_USER: ward_ops
          POSTGRES_PASSWORD: ward_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ward_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ward_ops:ward_ops@localhost:5432/ward_ops
      TEST_DATABASE_URL: postgresql://ward_ops:ward_ops@localhost:5432/ward_ops
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @ward-ops/database db:deploy

      - name: Seed reference data
        run: pnpm --filter @ward-ops/database db:seed

      - name: Re-run seed (idempotency)
        run: pnpm --filter @ward-ops/database db:seed

      - name: Build workspace packages
        run: pnpm --filter @ward-ops/contracts build && pnpm --filter @ward-ops/validation build && pnpm --filter @ward-ops/database build

      - name: API integration tests (auth, tenancy, access requests)
        run: pnpm --filter @ward-ops/api test:integration

  docker:
    name: Production Docker build + runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci
      OWNER_SETUP_TOKEN: ci-owner-setup-token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -f infrastructure/Dockerfile.api -t ward-ops-api:ci .

      - name: Build web image
        run: docker build --build-arg API_INTERNAL_URL=http://api:4000 -f infrastructure/Dockerfile.web -t ward-ops-web:ci .

      - name: Validate compose file
        working-directory: infrastructure
        run: docker compose config --quiet

      - name: Start smoke-test database
        run: |
          docker network create ward-ops-ci
          docker run --detach --name ward-ops-db --network ward-ops-ci \
            --env POSTGRES_DB=ward_ops \
            --env POSTGRES_USER=ward_ops \
            --env POSTGRES_PASSWORD=ward_ops \
            postgres:16-alpine
          for _ in {1..30}; do
            docker exec ward-ops-db pg_isready --username ward_ops --dbname ward_ops && exit 0
            sleep 2
          done
          docker logs ward-ops-db
          exit 1

      - name: Smoke-test API image startup
        run: |
          docker run --detach --name ward-ops-api --network ward-ops-ci --publish 4000:4000 \
            --env APP_ENV=development \
            --env SECURE_COOKIES=false \
            --env DATABASE_URL=postgresql://ward_ops:ward_ops@ward-ops-db:5432/ward_ops \
            ward-ops-api:ci
          for _ in {1..60}; do
            curl --fail --silent http://127.0.0.1:4000/health/live && exit 0
            sleep 2
          done
          docker logs ward-ops-api
          exit 1

      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm --force ward-ops-api ward-ops-db || true
          docker network rm ward-ops-ci || true
