services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ward_ops
      POSTGRES_USER: ward_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ward_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://ward_ops:${POSTGRES_PASSWORD}@db:5432/ward_ops
      REDIS_URL: redis://redis:6379
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:?Set OWNER_SETUP_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SECURE_COOKIES: "false"
      DOCUMENT_STORE_DIR: /app/data/objects
    volumes:
      - document_data:/app/data/objects
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  document_data:
