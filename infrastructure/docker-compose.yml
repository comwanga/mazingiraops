services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ward_ops
      POSTGRES_USER: ward_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ward_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://ward_ops:${POSTGRES_PASSWORD}@db:5432/ward_ops
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:?Set OWNER_SETUP_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SECURE_COOKIES: "false"
      DOCUMENT_STORE_DIR: /app/data/objects
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-mazingira-ops@example.go.ke}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - document_data:/app/data/objects
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  document_data:
